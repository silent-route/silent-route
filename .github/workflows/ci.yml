# Every push and pull request: tests on Apple Silicon and Intel, and a full
# universal build.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Xcode 26 (Liquid Glass needs its SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && swift --version
      - run: scripts/fetch-sing-box.sh
      - run: scripts/test.sh
      - run: scripts/build-app.sh
